<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot body -->
  <rect x="60" y="60" width="80" height="80" rx="10" fill="#4F46E5" stroke="#6366F1" stroke-width="2"/>

  <!-- Robot head -->
  <rect x="75" y="30" width="50" height="40" rx="8" fill="#4F46E5" stroke="#6366F1" stroke-width="2"/>

  <!-- Robot eyes -->
  <circle cx="85" cy="50" r="5" fill="#10B981"/>
  <circle cx="115" cy="50" r="5" fill="#10B981"/>

  <!-- Robot antenna -->
  <line x1="100" y1="25" x2="100" y2="15" stroke="#6366F1" stroke-width="2"/>
  <circle cx="100" cy="12" r="3" fill="#F59E0B"/>

  <!-- Robot arms -->
  <rect x="40" y="70" width="20" height="60" rx="5" fill="#4F46E5" stroke="#6366F1" stroke-width="2"/>
  <rect x="140" y="70" width="20" height="60" rx="5" fill="#4F46E5" stroke="#6366F1" stroke-width="2"/>

  <!-- Robot legs -->
  <rect x="70" y="140" width="15" height="30" rx="3" fill="#4F46E5" stroke="#6366F1" stroke-width="2"/>
  <rect x="115" y="140" width="15" height="30" rx="3" fill="#4F46E5" stroke="#6366F1" stroke-width="2"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="90" r="8" fill="#F59E0B"/>
  <rect x="85" y="105" width="30" height="5" rx="2" fill="#EC4899"/>
</svg>