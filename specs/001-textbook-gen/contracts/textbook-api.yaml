openapi: 3.0.0
info:
  title: Textbook API
  description: API for textbook content management and retrieval with enhanced UI/UX features
  version: 1.0.0
paths:
  /api/v1/textbook/chapters:
    get:
      summary: Get all textbook chapters
      responses:
        '200':
          description: List of all textbook chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
  /api/v1/textbook/chapters/{chapterId}:
    get:
      summary: Get a specific textbook chapter
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single textbook chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '404':
          description: Chapter not found
  /api/v1/textbook/chapters/{chapterId}/blocks:
    get:
      summary: Get content blocks for a specific chapter
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of content blocks in the chapter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentBlock'
        '404':
          description: Chapter not found
  /api/v1/textbook/chapters/{chapterId}/animated-elements:
    get:
      summary: Get animated UI elements for a specific chapter
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of animated UI elements for the chapter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnimatedUIElement'
        '404':
          description: Chapter not found
  /api/v1/textbook/search:
    post:
      summary: Search textbook content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
components:
  schemas:
    Chapter:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        slug:
          type: string
        order:
          type: integer
        content_blocks:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - slug
        - order
    ContentBlock:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the content block
        content:
          type: string
          description: The text content of the block
        block_type:
          type: string
          description: Type of content (paragraph, code, heading, etc.)
        position:
          type: integer
          description: Order within the chapter
        embedding_id:
          type: string
          description: Reference to vector embedding in Qdrant
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - content
        - block_type
        - position
    AnimatedUIElement:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the animated element
        element_type:
          type: string
          description: Type of animated element (tooltip, highlight, transition, etc.)
        target_selector:
          type: string
          description: CSS selector for the target element
        animation_type:
          type: string
          description: Type of animation (fade, slide, bounce, etc.)
        trigger_event:
          type: string
          description: Event that triggers the animation
        enabled:
          type: boolean
          description: Whether the animation is currently enabled
        chapter_id:
          type: string
          description: Reference to specific chapter if applicable
        created_at:
          type: string
          format: date-time
      required:
        - id
        - element_type
        - target_selector
        - animation_type
        - enabled
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: The search query
          example: "What are ROS 2 nodes?"
        selected_text:
          type: string
          description: Text selected by user for targeted questioning (optional)
          example: "ROS 2 nodes are the fundamental unit of a ROS system"
        top_k:
          type: integer
          description: Number of results to return
          default: 5
      required:
        - query
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
    SearchResult:
      type: object
      properties:
        chapter_id:
          type: string
        chapter_title:
          type: string
        content:
          type: string
        similarity_score:
          type: number
          format: float